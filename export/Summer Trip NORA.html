  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

y: 'Quicksand';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7138e4d1-6eba-48e4-9890-6ff6ad2b2f22\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Quicksand';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f2b23ff0-5c5a-40d7-a733-34fb8af45fc0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    /* NORA-inspired pastel palette + summer ocean accents */\n    --nora-pink:#F8B8C5;\n    --nora-pink-deep:#E68FA1;\n    --nora-yellow:#FFD66B;\n    --nora-yellow-soft:#FFF1C7;\n    --nora-mint:#B8E0D2;\n    --nora-cream:#FFF8EE;\n    --nora-cream-2:#FFEFD9;\n    --ocean:#5BB8D1;\n    --ocean-deep:#2E7A99;\n    --ocean-dark:#1A4D66;\n    --sand:#F4E3C1;\n    --sun:#FF9E5E;\n    --coral:#FF7A6B;\n    --leaf:#7BBF6A;\n    --ink:#2B3D4F;\n    --ink-soft:#5A6B7A;\n    --paper:#FFFCF6;\n  }\n  *{box-sizing:border-box;margin:0;padding:0;}\n  html,body{background:var(--paper);color:var(--ink);font-family:'Quicksand','Be Vietnam Pro',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}\n  img{max-width:100%;display:block;}\n  a{color:inherit;}\n  ::selection{background:var(--nora-yellow);color:var(--ink);}\n\n  .display{font-family:'Pacifico',cursive;font-weight:400;}\n  .container{max-width:1180px;margin:0 auto;padding:0 24px;}\n\n  /* ========= TOP NAV ========= */\n  .nav{position:sticky;top:0;z-index:50;background:rgba(255,252,246,.92);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid rgba(0,0,0,.05);}\n  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1180px;margin:0 auto;}\n  .brand{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--ocean-dark);}\n  .brand-mark{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--nora-pink) 0%,var(--nora-yellow) 100%);display:grid;place-items:center;color:#fff;font-family:'Pacifico',cursive;font-size:22px;line-height:1;box-shadow:0 6px 14px rgba(230,143,161,.35);}\n  .brand-text{display:flex;flex-direction:column;line-height:1.05;}\n  .brand-text b{font-size:18px;letter-spacing:.5px;}\n  .brand-text span{font-size:11px;font-weight:500;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1.2px;}\n  .nav-links{display:flex;gap:28px;font-size:14px;font-weight:600;}\n  .nav-links a{text-decoration:none;color:var(--ink);opacity:.78;transition:opacity .15s;}\n  .nav-links a:hover{opacity:1;color:var(--ocean-deep);}\n  .nav-cta{background:var(--coral);color:#fff;padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.5px;box-shadow:0 6px 14px rgba(255,122,107,.35);transition:transform .15s;}\n  .nav-cta:hover{transform:translateY(-1px);}\n  @media (max-width:780px){ .nav-links{display:none;} }\n\n  /* ========= HERO ========= */\n  .hero{position:relative;min-height:88vh;display:flex;align-items:center;justify-content:center;padding:80px 24px 120px;overflow:hidden;background:linear-gradient(180deg,#BFE8F2 0%,#7FCBE0 45%,#5BB8D1 100%);}\n  .hero::before{content:\"\";position:absolute;inset:0;background:\n    radial-gradient(60% 40% at 80% 15%,rgba(255,214,107,.5) 0%,transparent 60%),\n    radial-gradient(45% 30% at 15% 85%,rgba(255,255,255,.35) 0%,transparent 60%);\n    pointer-events:none;}\n  /* sun */\n  .sun{position:absolute;top:60px;right:8%;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFE7A6 0%,#FFB857 70%);box-shadow:0 0 80px rgba(255,184,87,.6);animation:sunPulse 6s ease-in-out infinite;}\n  @keyframes sunPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}\n  /* clouds */\n  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;filter:blur(.3px);}\n  .cloud::before,.cloud::after{content:\"\";position:absolute;background:#fff;border-radius:50%;}\n  .cloud-1{width:140px;height:34px;top:120px;left:8%;animation:drift 22s linear infinite;}\n  .cloud-1::before{width:60px;height:60px;top:-26px;left:18px;}\n  .cloud-1::after{width:46px;height:46px;top:-18px;left:70px;}\n  .cloud-2{width:100px;height:26px;top:200px;left:55%;animation:drift 28s linear infinite reverse;}\n  .cloud-2::before{width:46px;height:46px;top:-18px;left:14px;}\n  .cloud-2::after{width:36px;height:36px;top:-12px;left:50px;}\n  @keyframes drift{from{transform:translateX(-20px);}to{transform:translateX(40px);}}\n  /* waves at bottom */\n  .waves{position:absolute;left:0;right:0;bottom:-2px;height:140px;pointer-events:none;}\n  .waves svg{width:100%;height:100%;display:block;}\n\n  .hero-inner{position:relative;text-align:center;max-width:920px;color:#fff;z-index:2;}\n  .hero-eyebrow{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);color:var(--ocean-deep);padding:8px 18px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;box-shadow:0 8px 20px rgba(26,77,102,.18);}\n  .hero-eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(255,122,107,.3);}\n  .hero h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(48px,8vw,96px);line-height:1.05;margin:24px 0 14px;text-shadow:0 6px 24px rgba(26,77,102,.3);}\n  .hero h1 .accent{color:var(--nora-yellow);}\n  .hero-sub{font-size:clamp(16px,2.2vw,22px);font-weight:500;max-width:680px;margin:0 auto 36px;text-shadow:0 2px 12px rgba(26,77,102,.4);}\n  .hero-stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:18px;}\n  .hero-stat{background:rgba(255,255,255,.95);color:var(--ink);padding:14px 22px;border-radius:18px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 28px rgba(26,77,102,.18);}\n  .hero-stat .ico{font-size:24px;}\n  .hero-stat b{display:block;font-size:18px;color:var(--ocean-deep);}\n  .hero-stat span{font-size:12px;color:var(--ink-soft);font-weight:500;}\n\n  /* ========= GENERIC SECTION ========= */\n  section{padding:90px 0;}\n  .section-head{text-align:center;margin-bottom:54px;}\n  .section-eyebrow{display:inline-block;font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--coral);margin-bottom:12px;}\n  .section-title{font-family:'Pacifico',cursive;font-size:clamp(34px,5vw,54px);line-height:1.1;color:var(--ocean-dark);}\n  .section-sub{margin-top:14px;color:var(--ink-soft);font-size:16px;max-width:620px;margin-left:auto;margin-right:auto;}\n\n  /* ========= INTRO STRIP ========= */\n  .intro{background:var(--nora-cream);position:relative;}\n  .intro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}\n  .intro-card{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;box-shadow:0 10px 30px rgba(43,61,79,.06);border:1px solid rgba(0,0,0,.04);transition:transform .25s;}\n  .intro-card:hover{transform:translateY(-4px);}\n  .intro-card .em{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:32px;margin:0 auto 14px;}\n  .intro-card:nth-child(1) .em{background:#FFE3EA;}\n  .intro-card:nth-child(2) .em{background:#E2F2EB;}\n  .intro-card:nth-child(3) .em{background:#FFF1C7;}\n  .intro-card:nth-child(4) .em{background:#D8EEF6;}\n  .intro-card h4{font-size:14px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}\n  .intro-card b{font-size:22px;color:var(--ocean-dark);display:block;}\n  @media (max-width:820px){ .intro-grid{grid-template-columns:repeat(2,1fr);} }\n\n  /* ========= TIMELINE ========= */\n  .timeline-section{background:linear-gradient(180deg,var(--paper) 0%,#FFF5E2 100%);}\n  .day{display:grid;grid-template-columns:200px 1fr;gap:40px;margin-bottom:60px;}\n  .day-marker{position:sticky;top:90px;align-self:start;}\n  .day-badge{background:#fff;border-radius:24px;padding:22px 18px;text-align:center;box-shadow:0 14px 38px rgba(43,61,79,.1);border:2px dashed var(--nora-pink);}\n  .day-badge .num{font-family:'Pacifico',cursive;font-size:64px;line-height:1;color:var(--coral);}\n  .day-badge .label{display:block;margin-top:6px;font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);}\n  .day-badge .where{display:block;margin-top:10px;font-weight:600;font-size:14px;color:var(--ocean-deep);}\n\n  .day-events{position:relative;padding-left:30px;border-left:3px dotted var(--nora-pink);}\n  .event{position:relative;margin-bottom:22px;background:#fff;border-radius:20px;padding:20px 22px;box-shadow:0 8px 24px rgba(43,61,79,.06);border:1px solid rgba(0,0,0,.04);}\n  .event::before{content:\"\";position:absolute;left:-39px;top:24px;width:18px;height:18px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 5px var(--paper),0 0 0 7px var(--coral);}\n  .event-time{display:inline-block;font-weight:700;font-size:13px;color:#fff;background:var(--ocean);padding:4px 12px;border-radius:999px;margin-bottom:10px;}\n  .event-title{font-size:19px;font-weight:700;color:var(--ocean-dark);margin-bottom:6px;display:flex;align-items:center;gap:10px;}\n  .event-title .ico{font-size:22px;}\n  .event-desc{color:var(--ink-soft);font-size:15px;}\n  .event-tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}\n  .tag{background:var(--nora-yellow-soft);color:#A26F0E;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;}\n  .tag.pink{background:#FFE3EA;color:#B23A53;}\n  .tag.mint{background:#DDF1E8;color:#2A7A55;}\n  .tag.ocean{background:#D8EEF6;color:var(--ocean-deep);}\n\n  .event.highlight{background:linear-gradient(135deg,#FFF1C7 0%,#FFD66B 100%);border:none;}\n  .event.highlight .event-time{background:var(--coral);}\n  .event.highlight .event-title{color:#7A4A00;}\n  .event.highlight .event-desc{color:#7A4A00;opacity:.85;}\n\n  @media (max-width:820px){\n    .day{grid-template-columns:1fr;gap:20px;}\n    .day-marker{position:static;}\n    .day-badge{display:flex;align-items:center;gap:18px;text-align:left;padding:16px 20px;}\n    .day-badge .num{font-size:48px;}\n  }\n\n  /* ========= GALLERY ========= */\n  .gallery-section{background:#fff;}\n  .gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:180px;gap:12px;}\n  .gallery image-slot{border-radius:18px;overflow:hidden;}\n  .gallery .g1{grid-column:span 2;grid-row:span 2;}\n  .gallery .g2{grid-column:span 1;grid-row:span 1;}\n  .gallery .g3{grid-column:span 1;grid-row:span 1;}\n  .gallery .g4{grid-column:span 2;grid-row:span 1;}\n  .gallery .g5{grid-column:span 1;grid-row:span 1;}\n  .gallery .g6{grid-column:span 1;grid-row:span 1;}\n  .gallery .g7{grid-column:span 2;grid-row:span 1;}\n  @media (max-width:820px){\n    .gallery{grid-template-columns:repeat(2,1fr);grid-auto-rows:140px;}\n    .gallery .g1{grid-column:span 2;grid-row:span 2;}\n    .gallery .g4,.gallery .g7{grid-column:span 2;}\n  }\n\n  /* ========= PACKING LIST ========= */\n  .packing-section{background:linear-gradient(180deg,#FFF5E2 0%,var(--nora-cream) 100%);position:relative;overflow:hidden;}\n  .packing-section::before{content:\"\";position:absolute;top:-50px;right:-50px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,107,.4),transparent 70%);}\n  .packing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;position:relative;}\n  .pack-cat{background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 32px rgba(43,61,79,.07);}\n  .pack-cat-head{display:flex;align-items:center;gap:14px;padding-bottom:16px;margin-bottom:16px;border-bottom:2px dashed var(--nora-pink);}\n  .pack-cat-head .em{width:48px;height:48px;border-radius:14px;background:var(--nora-yellow-soft);display:grid;place-items:center;font-size:24px;}\n  .pack-cat-head h4{font-size:18px;font-weight:700;color:var(--ocean-dark);}\n  .pack-list{list-style:none;display:flex;flex-direction:column;gap:10px;}\n  .pack-list li{display:flex;align-items:flex-start;gap:10px;font-size:15px;color:var(--ink);}\n  .pack-list li::before{content:\"✓\";color:var(--leaf);font-weight:800;flex-shrink:0;}\n  @media (max-width:820px){ .packing-grid{grid-template-columns:1fr;} }\n\n  /* ========= MAP / LOCATIONS ========= */\n  .map-section{background:#fff;}\n  .map-wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:stretch;}\n  .map-illust{position:relative;background:linear-gradient(180deg,#BFE8F2 0%,#7FCBE0 100%);border-radius:28px;overflow:hidden;min-height:480px;}\n  .map-illust svg{position:absolute;inset:0;width:100%;height:100%;}\n  .map-list{display:flex;flex-direction:column;gap:14px;}\n  .map-item{background:var(--nora-cream);border-radius:18px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;}\n  .map-item .pin{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;}\n  .map-item h5{font-size:16px;font-weight:700;color:var(--ocean-dark);margin-bottom:4px;}\n  .map-item p{font-size:14px;color:var(--ink-soft);}\n  @media (max-width:820px){ .map-wrap{grid-template-columns:1fr;} .map-illust{min-height:340px;} }\n\n  /* ========= PRICE / CTA ========= */\n  .price-section{background:linear-gradient(135deg,var(--ocean-deep) 0%,var(--ocean-dark) 100%);color:#fff;position:relative;overflow:hidden;}\n  .price-section::before{content:\"\";position:absolute;inset:0;background:\n    radial-gradient(40% 60% at 90% 10%,rgba(255,214,107,.18) 0%,transparent 70%),\n    radial-gradient(35% 50% at 10% 90%,rgba(248,184,197,.15) 0%,transparent 70%);}\n  .price-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;position:relative;}\n  .price-card{background:rgba(255,255,255,.06);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:36px;}\n  .price-card h3{font-family:'Pacifico',cursive;font-size:36px;color:var(--nora-yellow);margin-bottom:8px;}\n  .price-amount{font-size:54px;font-weight:800;letter-spacing:-1px;margin:14px 0;font-family:'Be Vietnam Pro',sans-serif;}\n  .price-amount .unit{font-size:18px;font-weight:500;opacity:.7;}\n  .price-note{opacity:.75;font-size:14px;margin-bottom:20px;}\n  .price-list{list-style:none;display:flex;flex-direction:column;gap:10px;}\n  .price-list li{display:flex;align-items:flex-start;gap:10px;font-size:15px;}\n  .price-list li::before{content:\"✦\";color:var(--nora-yellow);flex-shrink:0;}\n  .price-list li.no::before{content:\"✕\";color:var(--coral);}\n  .price-cta-area .section-title{color:#fff;text-align:left;}\n  .price-cta-area .section-eyebrow{color:var(--nora-yellow);}\n  .price-cta-area p{font-size:17px;opacity:.85;margin:14px 0 24px;}\n  .btn-primary{display:inline-block;background:var(--coral);color:#fff;padding:16px 36px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 14px 32px rgba(255,122,107,.4);transition:transform .15s;}\n  .btn-primary:hover{transform:translateY(-2px);}\n  @media (max-width:820px){ .price-grid{grid-template-columns:1fr;} }\n\n  /* ========= CONTACT ========= */\n  .contact-section{background:var(--nora-cream);}\n  .contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}\n  .contact-card{background:#fff;border-radius:22px;padding:28px;text-align:center;box-shadow:0 10px 28px rgba(43,61,79,.06);}\n  .contact-card .em{width:60px;height:60px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:28px;background:var(--nora-yellow-soft);}\n  .contact-card h5{font-weight:700;color:var(--ocean-dark);margin-bottom:6px;font-size:16px;}\n  .contact-card p{color:var(--ink-soft);font-size:15px;}\n  @media (max-width:820px){ .contact-grid{grid-template-columns:1fr;} }\n\n  /* ========= FOOTER ========= */\n  footer{background:var(--ocean-dark);color:rgba(255,255,255,.8);padding:50px 0 30px;text-align:center;}\n  footer .brand{justify-content:center;color:#fff;margin-bottom:18px;}\n  footer .brand-text span{color:rgba(255,255,255,.6);}\n  footer p{font-size:14px;opacity:.7;margin-top:10px;}\n  footer .heart{color:var(--coral);}\n\n  /* SVG decorative */\n  .deco-stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;}\n  .star{position:absolute;width:14px;height:14px;background:var(--nora-yellow);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:.9;animation:twinkle 3s ease-in-out infinite;}\n  @keyframes twinkle{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.3);opacity:1;}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ========= NAV ========= -->\n<nav class=\"nav\">\n  <div class=\"nav-inner\">\n    <div class=\"brand\">\n      <div class=\"brand-mark\">N<\u002Fdiv>\n      <div class=\"brand-text\">\n        <b>NORA<\u002Fb>\n        <span>Summer Trip 2026<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"nav-links\">\n      <a href=\"#intro\">Tổng quan<\u002Fa>\n      <a href=\"#timeline\">Lịch trình<\u002Fa>\n      <a href=\"#gallery\">Gallery<\u002Fa>\n      <a href=\"#packing\">Đồ cần mang<\u002Fa>\n      <a href=\"#map\">Địa điểm<\u002Fa>\n      <a href=\"#contact\">Liên hệ<\u002Fa>\n    <\u002Fdiv>\n    <a href=\"#contact\" class=\"nav-cta\">Đăng ký ngay<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ========= HERO ========= -->\n<header class=\"hero\">\n  <div class=\"sun\"><\u002Fdiv>\n  <div class=\"cloud cloud-1\"><\u002Fdiv>\n  <div class=\"cloud cloud-2\"><\u002Fdiv>\n  <div class=\"deco-stars\">\n    <div class=\"star\" style=\"top:14%;left:18%;animation-delay:.2s;\"><\u002Fdiv>\n    <div class=\"star\" style=\"top:30%;left:78%;width:10px;height:10px;animation-delay:.8s;\"><\u002Fdiv>\n    <div class=\"star\" style=\"top:46%;left:6%;width:9px;height:9px;animation-delay:1.4s;\"><\u002Fdiv>\n    <div class=\"star\" style=\"top:22%;left:42%;width:7px;height:7px;animation-delay:1.7s;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"hero-inner\">\n    <div class=\"hero-eyebrow\"><span class=\"dot\"><\u002Fspan> NORA Family · Hè 2026<\u002Fdiv>\n    <h1>Summer Trip <span class=\"accent\">cùng NORA<\u002Fspan><br>Bình Hưng <span class=\"accent\">×<\u002Fspan> Vĩnh Hy<\u002Fh1>\n    <p class=\"hero-sub\">3 ngày 2 đêm rong chơi giữa biển xanh – cát trắng – nắng vàng. Tắm biển, lặn ngắm san hô, chèo SUP, tiệc tôm hùm và những kỷ niệm khó quên.<\u002Fp>\n    <div class=\"hero-stats\">\n      <div class=\"hero-stat\"><span class=\"ico\">🗓️<\u002Fspan><div><b>3 Ngày 2 Đêm<\u002Fb><span>Lịch trình chi tiết<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"hero-stat\"><span class=\"ico\">🌊<\u002Fspan><div><b>Bình Hưng<\u002Fb><span>Đảo &amp; Vịnh Vĩnh Hy<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"hero-stat\"><span class=\"ico\">🦞<\u002Fspan><div><b>Tiệc Hải Sản<\u002Fb><span>Tôm hùm · Ghẹ tươi<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"hero-stat\"><span class=\"ico\">🐠<\u002Fspan><div><b>Lặn San Hô<\u002Fb><span>Cano · SUP · GoPro<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"waves\">\n    <svg viewBox=\"0 0 1440 140\" preserveAspectRatio=\"none\">\n      <path d=\"M0,80 C240,140 480,20 720,60 C960,100 1200,40 1440,80 L1440,140 L0,140 Z\" fill=\"#FFF5E2\" opacity=\".5\"><\u002Fpath>\n      <path d=\"M0,100 C240,60 480,140 720,90 C960,40 1200,120 1440,90 L1440,140 L0,140 Z\" fill=\"#FFFCF6\"><\u002Fpath>\n    <\u002Fsvg>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ========= INTRO ========= -->\n<section class=\"intro\" id=\"intro\">\n  <div class=\"container\">\n    <div class=\"section-head\">\n      <div class=\"section-eyebrow\">★ Tóm tắt nhanh ★<\u002Fdiv>\n      <h2 class=\"section-title\">Hành trình của nhà NORA<\u002Fh2>\n      <p class=\"section-sub\">Một chuyến đi để cả đại gia đình NORA cùng nhau xả hơi sau một năm học rộn ràng – nơi biển xanh gặp nụ cười rực nắng.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"intro-grid\">\n      <div class=\"intro-card\">\n        <div class=\"em\">📍<\u002Fdiv>\n        <h4>Điểm đến<\u002Fh4>\n        <b>Bình Hưng – Vĩnh Hy<\u002Fb>\n      <\u002Fdiv>\n      <div class=\"intro-card\">\n        <div class=\"em\">⏰<\u002Fdiv>\n        <h4>Thời gian<\u002Fh4>\n        <b>3 Ngày · 2 Đêm<\u002Fb>\n      <\u002Fdiv>\n      <div class=\"intro-card\">\n        <div class=\"em\">🚌<\u002Fdiv>\n        <h4>Tập trung<\u002Fh4>\n        <b>Cây xăng số 74<\u002Fb>\n      <\u002Fdiv>\n      <div class=\"intro-card\">\n        <div class=\"em\">👨‍👩‍👧<\u002Fdiv>\n        <h4>Đối tượng<\u002Fh4>\n        <b>Gia đình NORA<\u002Fb>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========= TIMELINE ========= -->\n<section class=\"timeline-section\" id=\"timeline\">\n  <div class=\"container\">\n    <div class=\"section-head\">\n      <div class=\"section-eyebrow\">☀ Lịch trình chi tiết ☀<\u002Fdiv>\n      <h2 class=\"section-title\">3 Ngày Rực Nắng<\u002Fh2>\n      <p class=\"section-sub\">Từ bữa sáng ở chợ quê đến tiệc tôm hùm dưới ánh đèn karaoke – mỗi khoảnh khắc đều được chuẩn bị kỹ lưỡng để cả nhà NORA cùng tận hưởng.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- DAY 1 -->\n    <div class=\"day\">\n      <div class=\"day-marker\">\n        <div class=\"day-badge\">\n          <div><span class=\"num\">01<\u002Fspan><span class=\"label\">Ngày Một<\u002Fspan><span class=\"where\">Khám phá đảo<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"day-events\">\n        <div class=\"event\">\n          <span class=\"event-time\">Sáng sớm<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🏝️<\u002Fspan> Khởi hành từ Sài Gòn<\u002Fdiv>\n          <div class=\"event-desc\">Cả đoàn tự di chuyển xuống điểm tập kết. Tour sẽ đón mọi người từ <b>cây xăng số 74<\u002Fb>.<\u002Fdiv>\n          <div class=\"event-tags\"><span class=\"tag\">Tự túc di chuyển<\u002Fspan><span class=\"tag pink\">Tập trung tại 74<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">07:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🍜<\u002Fspan> Ăn sáng tại chợ<\u002Fdiv>\n          <div class=\"event-desc\">Thưởng thức bữa sáng địa phương đậm chất chợ quê – bánh canh, hủ tiếu, bún cá tươi rói.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">07:30<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🛥️<\u002Fspan> Đi cano khám phá<\u002Fdiv>\n          <div class=\"event-desc\">Lên cano cao tốc bắt đầu hành trình – Hang Sâu, Đá Vách, những điểm đẹp nhất của vùng biển Bình Hưng.<\u002Fdiv>\n          <div class=\"event-tags\"><span class=\"tag ocean\">Hang Sâu<\u002Fspan><span class=\"tag ocean\">Đá Vách<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event highlight\">\n          <span class=\"event-time\">Cả buổi sáng<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🐠<\u002Fspan> Tắm biển · Lặn ngắm san hô · Chèo SUP<\u002Fdiv>\n          <div class=\"event-desc\">Tắm biển ở <b>Bãi Cây Me<\u002Fb> – nước trong vắt thấy đáy. Chèo SUP, lặn ngắm san hô đầy màu sắc, picnic &amp; chụp ảnh GoPro dưới nước.<\u002Fdiv>\n          <div class=\"event-tags\"><span class=\"tag mint\">Bãi Cây Me<\u002Fspan><span class=\"tag mint\">SUP<\u002Fspan><span class=\"tag mint\">San hô<\u002Fspan><span class=\"tag mint\">GoPro<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">12:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🍤<\u002Fspan> Ăn trưa tại bè<\u002Fdiv>\n          <div class=\"event-desc\">Bữa trưa hải sản tươi sống ngay trên bè nổi giữa biển – cá, mực, tôm vừa mới đánh bắt.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">14:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🏨<\u002Fspan> Về khách sạn nghỉ ngơi<\u002Fdiv>\n          <div class=\"event-desc\">Nhận phòng, nghỉ trưa, sạc lại năng lượng cho buổi chiều.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">15:30 – 16:30<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🥚<\u002Fspan> Tham quan Bãi Đá Trứng<\u002Fdiv>\n          <div class=\"event-desc\">Ngắm hàng ngàn viên đá hình quả trứng được sóng biển bào mòn qua hàng triệu năm – background sống ảo cực đỉnh.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event highlight\">\n          <span class=\"event-time\">17:30<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🦞<\u002Fspan> Ăn tối tại bè – có Tôm Hùm<\u002Fdiv>\n          <div class=\"event-desc\">Tiệc hải sản hoành tráng giữa biển đêm với <b>tôm hùm tươi<\u002Fb> – đặc sản trứ danh của Bình Hưng.<\u002Fdiv>\n          <div class=\"event-tags\"><span class=\"tag pink\">Tôm hùm<\u002Fspan><span class=\"tag mint\">Bè nổi<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">19:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🌃<\u002Fspan> Đảo Tự Do<\u002Fdiv>\n          <div class=\"event-desc\">Buổi tối tự do dạo phố biển, uống cà phê, ngắm sao – mỗi người một chương trình riêng.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- DAY 2 -->\n    <div class=\"day\">\n      <div class=\"day-marker\">\n        <div class=\"day-badge\">\n          <div><span class=\"num\">02<\u002Fspan><span class=\"label\">Ngày Hai<\u002Fspan><span class=\"where\">Vịnh &amp; Vườn nho<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"day-events\">\n        <div class=\"event\">\n          <span class=\"event-time\">07:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🥐<\u002Fspan> Ăn sáng tại chợ<\u002Fdiv>\n          <div class=\"event-desc\">Khởi đầu ngày mới với bữa sáng đặc sản địa phương.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">08:30<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🏖️<\u002Fspan> Tắm biển Bãi Kinh <span style=\"opacity:.6;font-size:14px;font-weight:500;\">(hoặc Hang Rái)<\u002Fspan><\u002Fdiv>\n          <div class=\"event-desc\">Bãi Kinh – một trong những bãi biển đẹp nhất khu vực với cát trắng mịn, nước xanh ngọc bích.<\u002Fdiv>\n          <div class=\"event-tags\"><span class=\"tag mint\">Bãi Kinh<\u002Fspan><span class=\"tag ocean\">Tuỳ chọn Hang Rái<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">11:30<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🍲<\u002Fspan> Ăn cơm gia đình<\u002Fdiv>\n          <div class=\"event-desc\">Bữa trưa ấm cúng theo phong cách cơm nhà Việt – canh, mặn, xào, rau quê.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event highlight\">\n          <span class=\"event-time\">13:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">⛵<\u002Fspan> Vịnh Vĩnh Hy<\u002Fdiv>\n          <div class=\"event-desc\">Một trong <b>4 vịnh đẹp nhất Việt Nam<\u002Fb> – đi tàu đáy kính ngắm rạn san hô, thuyền thúng, biển trong vắt như gương.<\u002Fdiv>\n          <div class=\"event-tags\"><span class=\"tag pink\">Top 4 vịnh đẹp VN<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">14:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🍇<\u002Fspan> Vườn nho<\u002Fdiv>\n          <div class=\"event-desc\">Tham quan vườn nho Ninh Thuận trĩu quả, tự tay hái nho và thưởng thức rượu vang nho địa phương.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">15:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🪨<\u002Fspan> Hang Rái<\u002Fdiv>\n          <div class=\"event-desc\">Kỳ quan đá san hô cổ độc đáo – nơi sóng vỗ tung bọt trắng xoá tạo nên những khung hình ngoạn mục.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">17:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🏨<\u002Fspan> Về khách sạn<\u002Fdiv>\n          <div class=\"event-desc\">Nghỉ ngơi, tắm rửa, chuẩn bị cho buổi tối tiệc tùng.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event highlight\">\n          <span class=\"event-time\">18:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🎤<\u002Fspan> Tiệc tối – Ghẹ · Tôm hùm · Karaoke<\u002Fdiv>\n          <div class=\"event-desc\">Đêm tiệc hải sản đỉnh cao với <b>ghẹ và tôm hùm<\u002Fb> – và đừng quên màn karaoke \"phá đảo\" cùng cả gia đình NORA.<\u002Fdiv>\n          <div class=\"event-tags\"><span class=\"tag pink\">Ghẹ<\u002Fspan><span class=\"tag pink\">Tôm hùm<\u002Fspan><span class=\"tag\">Karaoke<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- DAY 3 -->\n    <div class=\"day\">\n      <div class=\"day-marker\">\n        <div class=\"day-badge\">\n          <div><span class=\"num\">03<\u002Fspan><span class=\"label\">Ngày Ba<\u002Fspan><span class=\"where\">Tạm biệt<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"day-events\">\n        <div class=\"event\">\n          <span class=\"event-time\">Sáng<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🐟<\u002Fspan> Cano · Lặn ngắm san hô<\u002Fdiv>\n          <div class=\"event-desc\">Buổi sáng cuối cùng – lên cano dạo biển và lặn ngắm san hô lần cuối trước khi nói lời tạm biệt.<\u002Fdiv>\n          <div class=\"event-tags\"><span class=\"tag ocean\">Cano<\u002Fspan><span class=\"tag mint\">San hô<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">11:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🛏️<\u002Fspan> Trả phòng<\u002Fdiv>\n          <div class=\"event-desc\">Check-out khách sạn, gửi hành lý chuẩn bị di chuyển.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">12:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🍽️<\u002Fspan> Ăn trưa<\u002Fdiv>\n          <div class=\"event-desc\">Bữa trưa cuối cùng đậm hương vị Ninh Thuận trước khi lên đường về.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event highlight\">\n          <span class=\"event-time\">14:00<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">🐑<\u002Fspan> Tham quan Đồng Cừu<\u002Fdiv>\n          <div class=\"event-desc\">Điểm cuối hành trình – đồng cừu An Hoà rộng mênh mông với hàng trăm chú cừu hiền lành. Background \"thảo nguyên Mông Cổ\" giữa lòng Ninh Thuận.<\u002Fdiv>\n          <div class=\"event-tags\"><span class=\"tag\">Đồng Cừu An Hoà<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"event\">\n          <span class=\"event-time\">Chiều<\u002Fspan>\n          <div class=\"event-title\"><span class=\"ico\">👋<\u002Fspan> Chia tay – Hẹn gặp lại<\u002Fdiv>\n          <div class=\"event-desc\">Tạm biệt Bình Hưng – Vĩnh Hy, mang theo những kỷ niệm đẹp nhất về lại Sài Gòn.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========= GALLERY ========= -->\n<section class=\"gallery-section\" id=\"gallery\">\n  <div class=\"container\">\n    <div class=\"section-head\">\n      <div class=\"section-eyebrow\">📷 Gallery<\u002Fdiv>\n      <h2 class=\"section-title\">Khoảnh khắc đá
